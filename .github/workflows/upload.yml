name: Auto YouTube Uploader (Client 1 & 2)

on:
  schedule:
    - cron: '30 8 * * *' # Indian Time (IST) ke hisab se roz dopahar 2:00 baje
  workflow_dispatch: # Manual trigger ke liye

jobs:
  upload-client-1:
    name: Upload for Client 1
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Uploader for Client 1
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
        YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        GD_REFRESH_TOKEN: ${{ secrets.GD_REFRESH_TOKEN }}
        DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      run: python uploader.py

  upload-client-2:
    name: Upload for Client 2
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Uploader for Client 2
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        YT_CLIENT_ID: ${{ secrets.CLIENT2_CLIENT_ID }}
        YT_CLIENT_SECRET: ${{ secrets.CLIENT2_CLIENT_SECRET }}
        YT_REFRESH_TOKEN: ${{ secrets.CLIENT2_REFRESH_TOKEN }}
        GD_REFRESH_TOKEN: ${{ secrets.CLIENT2_REFRESH_TOKEN }}
        DRIVE_FOLDER_ID: ${{ secrets.CLIENT2_DRIVE_FOLDER_ID }}
      run: python uploader.py
